# SPDX-License-Identifier: CC0-1.0
# Tuning file for OmniVision OV02E10 on Intel IPU7 (Lunar Lake)
# Used by libcamera's Simple pipeline handler / Software ISP
#
# For libcamera 0.8 and later. install.sh and build-patched-libcamera.sh
# install it as ov02e10.yaml in .../share/libcamera/ipa/softisp/: 0.8 renamed
# the Software ISP IPA from "simple" to "softisp" and no longer reads
# ipa/simple/. It needs no libcamera patches beyond the Bayer fix.
#
# Tested on the Galaxy Book5 Pro (OV02E10, IPU7) with libcamera 0.8.0 on
# CachyOS, EndeavourOS, Ubuntu 26.04 and Debian 13: correct colour through
# PipeWire and camera-relay.
#
# CCMs: start from the 0.7.2 matrices (measured with saturated pixels left
# out of AWB, which 0.8 now does upstream), with each row scaled to sum to
# exactly 1.0 so neutral greys stay neutral after AWB, then multiplied by a
# saturation matrix S = 1.35*I - 0.35*(1 * w^T) (w = Rec. 709 luma weights;
# every row of S sums to 1, so the row sums stay 1.0). Compared on CachyOS in
# daylight against the 0.7.2 matrices, the same +20%, and the original
# ov02e10.yaml matrices (rows 1.1-1.6): this gave a neutral white wall
# (R/G 1.00), about 60% more saturation and unchanged skin tone, where the
# original matrices turned the wall pink (R/G 1.12).
#
# On top of that, two changes for the Bayesian AWB below (tested on Fedora 45
# with libcamera 0.8.0):
#   - Saturation 1.3, baked in: each matrix multiplied by the matrix the
#     SoftISP builds for the Saturation control (BT.601 YCbCr, chroma x1.3), so
#     the picture is the same as setting Saturation=1.3, with no control
#     needed. Rows still sum to 1.0. Compared at 1.0, 1.15, 1.3 and 1.5 on a
#     ColorChecker in daylight and lamp light; 1.5 was too strong and lifted
#     colour noise at night.
#   - Warm light: the red row is raised x1.30 at 2700 K and x1.20 at 3200 K,
#     4500 K and up unchanged (so those two red rows sum to 1.30 and 1.20, on
#     purpose). AWB neutralises lamp light almost completely, which left
#     white walls yellow-green under 2700 K lamps (red level with green);
#     this keeps them cream, as a phone shows them. 4000 K lighting stays
#     neutral.
#
# Agc: with the OV02E10 sensor helper (build-patched-libcamera.sh step 4b),
# 0.8 runs libipa's mean-luminance AGC, which reads this section. Without the
# helper (stock 0.8) it runs the MSV AGC and ignores the section.
# exposureTarget was a 0.7.2 patch key and is ignored by 0.8, so it is left
# out (install.sh also uses it to recognise the 0.7.2 file).
#
# Based on the multi-temperature CCM tuning by @david-bartlett.
# Anchors: 2700K, 3200K, 4500K, 5500K, 6000K, 6500K
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      # The OV02E10 pedestal measures 64 codes at 10-bit (raw frame, lens
      # covered, average 64.3), i.e. 4096 in 16-bit. 4352 (68, one 8-bit
      # step higher) gave deeper blacks in daylight, but at night (gain
      # 15.5x) it cut too much red from the darks: skin went mauve under warm
      # light and black clothing turned blue or green-teal. The red pedestal
      # is the lowest (61.6), so it loses most. 4096 keeps skin and blacks
      # closer to neutral in both warm and cool night light.
      blackLevel: 4096
  - Awb:
      # Bayesian AWB (libipa, stock 0.8). Instead of assuming the whole frame
      # averages to grey, it picks the light's colour temperature from a
      # calibrated curve, so a room with one strong colour (blue walls, a
      # blue headboard) doesn't throw the colour off as much.
      # colourGains: white paper filling the frame at a fixed exposure, under
      # a Hue bulb at 2200-5000 K and daylight at 6500-8000 K (temperatures
      # read with a phone app).
      # transverseNeg lets AWB step off the curve to remove a green cast:
      # 0.05 left daylight walls slightly green, 0.10 also took the warmth
      # out of lamp light; 0.07 is clean in daylight and keeps lamps warm.
      algorithm: bayes
      transversePos: 0.1
      transverseNeg: 0.07
      colourGains:
        - ct: 2200
          gains: [ 1.0235, 2.2015 ]
        - ct: 2700
          gains: [ 1.1101, 2.1630 ]
        - ct: 3000
          gains: [ 1.1863, 2.0492 ]
        - ct: 4000
          gains: [ 1.3978, 1.8363 ]
        - ct: 5000
          gains: [ 1.5057, 1.7593 ]
        - ct: 6500
          gains: [ 1.7981, 1.3245 ]
        - ct: 7200
          gains: [ 1.8257, 1.2597 ]
        - ct: 8000
          gains: [ 1.8632, 1.2038 ]
      # A flat prior (every temperature equally likely). The SoftISP has no
      # lux measurement and always passes 500, so one prior is all it uses.
      priors:
        - lux: 500
          ct: [ 2200, 2300, 2400, 2500, 2600, 2700, 2800, 2900, 3000, 3100, 3200, 3300, 3400, 3500, 3600, 3700, 3800, 3900, 4000, 4100, 4200, 4300, 4400, 4500, 4600, 4700, 4800, 4900, 5000, 5100, 5200, 5300, 5400, 5500, 5600, 5700, 5800, 5900, 6000, 6100, 6200, 6300, 6400, 6500, 6600, 6700, 6800, 6900, 7000, 7100, 7200, 7300, 7400, 7500, 7600, 7700, 7800, 7900, 8000 ]
          probability: [ 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000 ]
      AwbMode:
        Auto:
          lo: 2200
          hi: 8000
  - Ccm:
      ccms:
        - ct: 2700
          ccm: [  2.427, -1.084, -0.043,
                 -0.323,  1.865, -0.542,
                 -0.177, -1.289,  2.466 ]
        - ct: 3200
          ccm: [  2.207, -0.959, -0.048,
                 -0.380,  1.816, -0.436,
                 -0.163, -1.112,  2.275 ]
        - ct: 4500
          ccm: [  1.796, -0.700, -0.096,
                 -0.376,  1.587, -0.211,
                 -0.143, -0.877,  2.020 ]
        - ct: 5500
          ccm: [  1.843, -0.669, -0.174,
                 -0.299,  1.408, -0.109,
                 -0.137, -0.829,  1.966 ]
        - ct: 6000
          ccm: [  1.800, -0.581, -0.219,
                 -0.256,  1.268, -0.012,
                 -0.110, -0.793,  1.903 ]
        - ct: 6500
          ccm: [  1.775, -0.530, -0.245,
                 -0.229,  1.210,  0.019,
                 -0.092, -0.794,  1.886 ]
  - Adjust:
  - Agc:
      # Mean-luminance AGC target (libipa's default is 0.16). It replaces
      # exposureTarget; lower is darker and less noisy. Indoors 0.12-0.20 was
      # tried (0.20 is visibly grainier); with the backlight constraint below,
      # 0.16 looked too bright in daylight, so 0.15.
      relativeLuminanceTarget: 0.15
      # Low light: let the AGC lengthen the frame instead of only raising gain.
      # Needs softisp-frame-length.patch (build-patched-libcamera.sh step
      # 4d); ignored by an unpatched libcamera. Values are in libcamera's time
      # units for this sensor, which run 1.35x long (the OV02E10 driver reports
      # a 144 MHz pixel rate, but the sensor runs about 40.6 fps at the default
      # frame length): 66666 is a real 48.8 ms frame, about 20 fps at worst.
      # The stages keep the full frame rate until the gain reaches 12x.
      maxFrameDuration: 66666
      AeExposureMode:
        Normal:
          exposureTime: [ 33000, 66000 ]
          gain: [ 12.0, 15.5 ]
      # Backlight: the AGC averages the whole frame, so a bright window in
      # shot makes it cut exposure and leaves a face dark. This lower bound
      # requires the 20-60% band of pixels (darkest to brightest: roughly the
      # person and the room, not the window) to reach at least 0.15, and only
      # raises exposure when they don't. Tested sitting next to a window.
      AeConstraintMode:
        Normal:
          lower:
            qLo: 0.2
            qHi: 0.6
            yTarget: 0.15
...
